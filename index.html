<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Game Engine Toolkit - Live Demo</title>
    <script src="https://cjrtnc.cheerpj.com/2.2/loader.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #display {
            width: 850px;
            height: 650px;
            border: 2px solid #444;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        h1 { margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 20px; }
    </style>
</head>
<body>
<h1>Interactive Game Engine Toolkit</h1>
<p>Loading Java Application via CheerpJ WebAssembly...</p>
<div id="display"></div>

<script>
    async function runJavaApp() {
        await cheerpjInit();
        cheerpjCreateDisplay(850, 650, document.getElementById("display"));
        // Runs your MainApp entry point directly from compiled class files
        await cheerpjRunMain("engine.MainApp", "/app/out/production/GameEngineToolKit/:/app/out/production/GameEngineToolkit/");
    }
    runJavaApp();
</script>
</body>
</html>
